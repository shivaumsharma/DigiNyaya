server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router client-side routes (e.g. /case/123) must
    # resolve to index.html, not a 404, on a direct load/refresh -- the
    # same problem the Render Static Site's rewrite rule solved.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
