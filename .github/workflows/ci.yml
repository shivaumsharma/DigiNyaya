name: CI

# CI matches production's Python version (Render's backend service pins
# PYTHON_VERSION=3.11.9 to avoid a pydantic-core source build), not whatever
# a local dev machine happens to have.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
           pip install -r requirements.txt
           pip install ruff
      - name: Ruff (lint)
        run: python -m ruff check app/ scripts/ tests/
      - name: pytest
        run: python -m pytest -q

  eval-gate:
    name: Golden eval suite (18 cases)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run DB migrations
        # eval_cases.py (unlike tests/conftest.py, which calls
        # Base.metadata.create_all() directly) uses app.db's real,
        # file-based DIGINYAYA_DB default -- on a fresh CI checkout that
        # file doesn't exist yet, so its schema has to come from a real
        # `alembic upgrade head`, the same way a real deployment's Docker
        # CMD does it, instead of silently relying on a pre-existing file.
        run: python -m alembic upgrade head
      - name: Run golden eval suite
        # DIGINYAYA_USE_LLM defaults to 0 inside eval_cases.py itself (scripted
        # mode) -- no SARVAM_API_KEY needed, no external calls, no cost.
        # Fails the build on a regression in bands A-D (easy/ambiguous/
        # conflicting/escalation) or if average composite confidence drops
        # below the floor set in scripts/eval_cases.py -- NOT on a stress-band
        # failure, which the suite is deliberately designed to allow.
        run: python -m scripts.eval_cases

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npx vitest run

  build-images:
    name: Build & push images (GHCR + ECR)
    runs-on: ubuntu-latest
    # Build on every PR (catches a broken Dockerfile before merge) but only
    # push on main -- GHCR is free, no cloud billing account needed; this
    # does NOT deploy anywhere, it just publishes the image. The backend
    # image is also pushed to ECR on main so deploy-backend below has
    # something to point Elastic Beanstalk at.
    needs: [backend, eval-gate, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write # required for the AWS OIDC role assumption below
    outputs:
      ecr_image_uri: ${{ steps.ecr_image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/diginyaya-backend:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/diginyaya-backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/diginyaya-frontend:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/diginyaya-frontend:latest

      # --- AWS: only on main, only once infra/ has been applied and these
      # repo variables/secrets exist (set them from `terraform output` --
      # see infra/README.md). A missing AWS_DEPLOY_ROLE_ARN is expected
      # (and this whole block is skipped) until that's done. ---
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
        if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
      - name: Build & push backend image to ECR
        if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
        id: ecr_image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/diginyaya-backend:${{ github.sha }}"
          docker build -t "$IMAGE_URI" backend
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend (Elastic Beanstalk)
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && needs.build-images.outputs.ecr_image_uri != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
      - name: Render Dockerrun.aws.json with the freshly-pushed image
        run: |
          sed "s|__ECR_IMAGE_URI__|${{ needs.build-images.outputs.ecr_image_uri }}|" \
            backend/Dockerrun.aws.json > Dockerrun.aws.json
      - uses: einaregilsson/beanstalk-deploy@v22
        # No explicit aws_access_key/aws_secret_key: configure-aws-credentials
        # above already exported temporary OIDC credentials into the runner's
        # environment, which this action's underlying AWS SDK picks up
        # automatically.
        with:
          application_name: ${{ vars.EB_APPLICATION_NAME || 'diginyaya' }}
          environment_name: ${{ vars.EB_ENVIRONMENT_NAME || 'diginyaya-backend-prod' }}
          version_label: ${{ github.sha }}
          region: ${{ vars.AWS_REGION || 'eu-north-1' }}
          deployment_package: Dockerrun.aws.json

  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (pointed at the deployed backend)
        env:
          VITE_API_BASE: ${{ vars.BACKEND_URL }}
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
      - name: Sync build output to S3
        run: aws s3 sync dist/ s3://${{ vars.S3_FRONTEND_BUCKET }}/ --delete
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
